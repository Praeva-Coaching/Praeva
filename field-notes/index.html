I spent thirty-eight years in organizational command — thirty one in uniform, the balance in civilian and advisory work — watching capable, committed leaders deliver results below what their talent warranted. Not because they lacked judgment. Not because they lacked drive. Because the structures they were operating inside could not hold the loads being placed on them.

PRAEVA is the practice I founded to do something about that.

The name comes from the Latin praevia — going before, leading the way, clearing the path. The mark is doctrine in image form.

Look at the arrows pressing down on the arch. They are not abstractions. Every organization I have observed at scale is carrying some combination of these loads:

• Accelerating market change that outruns existing strategy

        copyText: `Why Architecture, Not Leadership?

Leadership is what a person does. Architecture is what an organization is. The difference is what makes some institutions endure.

Leadership is behavioral. It lives in a single person — the way they decide, the standard they hold, the example they set. When the leader is present and capable, leadership is visible. When the leader is absent, distracted, or replaced, it is gone.

Architecture is structural. It lives in how decisions route, how priorities get enforced, how authority is documented, how the organization performs in the leader's absence. Architecture endures because it is built into the institution rather than carried by the person.

🔷 Organizational Alignment — Calibrating behavioral gravity through incentive design.
🔷 Execution Cadence — The governance calendar as architecture.
🔷 Scalable Delegation — Transferring authority within explicit, documented boundaries.

        copyText: `Strategic Clarity Is Not a Vision Statement

On Friday I shared a moment from years ago — a chief of staff who handed me my priorities of work in twenty-two words. Represent the four-star. Work for me. Don't screw that up.

The reason that moment has stayed with me is that it was the cleanest example of Strategic Clarity I have ever received. And most organizations never get anything close to it.

Most organizations have vision statements. Far fewer have Strategic Clarity. The difference is what they have decided not to do.

A vision statement tells you what an organization aspires to become. Strategic Clarity tells you what it has chosen to pursue, what it has chosen to exclude, and how the leader will resolve the next ten resource conflicts that haven't happened yet. One is decoration. The other is load-bearing.

The failure mode is not usually a bad strategy document. It is the slow accumulation of priorities that no one has the authority — or the discipline — to refuse.

I call it strategic abdication. The pattern is recognizable: priorities arrive from every direction. Functional channels, customers, board members, peers, the most recent crisis, the most recent opportunity. Each one is legitimate on its own terms. None of them are ranked against the others. The organization's actual priority hierarchy is determined, in practice, by whoever sent the most recent email from the highest-ranking sender.

That is not Strategic Clarity. It is the absence of it dressed in motion.

The discipline of exclusion is what makes a strategy structural rather than aspirational. It is the leader saying — out loud, in writing, with consequences — what the organization will not pursue this quarter, this year, this season. Not "deprioritize." Not "park for later." Exclude. The clarity comes from the line you draw, not the list you keep.

Strategic Clarity is established when the senior team can name the top three priorities in rank order without preparation, when resource decisions visibly enforce that order, and when at least one consequential resource conflict has been decided by reference to the framework rather than by escalation to the leader.

Below that threshold, every other pillar of the architecture wobbles. Authority cannot be drawn without a direction to draw it toward. Alignment cannot be established without something to align around. Cadence drifts. Delegation becomes risky.

This is the work I describe as disciplining the system. Not improving it. Not optimizing it. Disciplining it — because the system, left to itself, will drift toward proliferation, ambiguity, and autopilot. The leader's architectural work is the sustained counter-force that holds the structural conditions in place against the institutional forces that continuously work to erode them.

Strategic Clarity is the first place that work shows up. It is also the first place it is usually skipped.

        date: "May 2, 2025",

        copyText: `The Problem Most Leaders Can't Quite See

Had dinner tonight with a former peer — someone who had read a few of my LinkedIn posts and was curious about what I was up to.

He's a thoughtful operator. Decades of experience. He has seen organizations from the inside in ways most people never will.

He told me he had read the posts but wasn't quite sure what I was getting at. So I walked him through it — architecture rather than behavior, the five pillars, the discipline of exclusion, what it looks like when the structure is sound and what it looks like when it isn't.

About fifteen minutes in, he nodded. "Okay. I get it now."

Then he said the thing I have been thinking about all evening. "But I'm not sure I see it as a problem worth solving."

He wasn't being dismissive. He was being honest. And his honesty surfaced the actual obstacle this work has to overcome.

Most leadership development — the kind he was trained in, the kind I was trained in — is focused on the leader as a person. Personal growth. Self-awareness. Communication style. Decision-making under pressure. Behavior. Presence.

That work is real, and it matters.

But it has trained an entire generation of senior leaders to see organizational problems as people problems, behavior problems, or culture problems. The structural layer underneath — the way authority is drawn, the way priorities are ranked, the way cadence is designed, the way decisions actually move — is invisible to most of them. Not because they aren't smart. Because no one ever pointed at it.

You cannot solve a problem you cannot see.

That is the recognition gap. And it is the actual reason organizations keep producing the same failures with different people in the chairs.

The example I gave him over dinner was maintenance. The Army learned a long time ago that you fix equipment as far forward as possible — at the lowest competent level, closest to the problem. Not because forward units are better mechanics, but because every echelon a decision has to climb is friction the system pays for. Authority drawn correctly puts the decision where the work is.

The same principle governs every other kind of decision an organization makes. Resource allocation. Personnel calls. Customer commitments. Course corrections. When authority is drawn at the wrong level — almost always too high — every decision becomes a queue item on the leader's calendar. The leader becomes the bottleneck of the system they were supposed to be leading.

That isn't a leadership problem. That is a design problem. And no amount of personal development will fix it.

That is the problem I'm trying to solve.

It is invisible until it isn't. And once you see it, you cannot unsee it.

        copyText: `Strategic Clarity Drifts. It Does Not Collapse.

Every senior leader I have worked with has had at least one of them. A person who believes their idea is better than the leader's decision. It is rarely direct. It is almost always indirect, in the passive-aggressive register that compares the actual outcome to what could have been if their choice had been made. The comparison surfaces in side comments, in meeting asides, in the framing of unrelated agenda items. There is rarely anything to confront, because there is rarely anything explicitly said.

And when a change in leadership arrives, so does the relitigator.

They surface again, with their version of the plan, presented as helpful input for the incoming leader. The plan will not be approved. They know it will not be approved. They will not let it go.

The pattern is read, almost universally, as a personality problem. Difficult. Political. Does not take no for an answer. That read is incomplete.

The relitigation persists because the original exclusion was decided but never structurally enforced. The leader said no. The system was not built to refuse the question being reopened. So the no has to be re-said, by the leader personally, in every meeting where priorities come up, indefinitely.

That is the cost. Not the relitigator's victory, which almost never comes. The cost is what the relitigation does to the leader's bandwidth, to the senior team's clarity, and to the organization's discipline. The exclusion decision is technically still in force. The organization has drifted around it.

Drift is what strategic abdication actually looks like in practice. Not a dramatic reversal. A slow erosion of the discipline that exclusion requires, because the question keeps being reopened and the leader cannot hold every line at every meeting against every relitigator forever.

The architecture of Strategic Clarity is not the decision. It is the sustained refusal to remake the decision when pressure asks you to. Enforcement is structural, not personal. Written exclusion documentation that names the decision and the reasoning behind it. Standing agenda discipline that does not reopen the question without a defined trigger. Senior team alignment so that the leader is not the only voice holding the line. And a stated answer to the question what would have to change for this decision to be revisited — which converts indefinite relitigation into bounded conditions.

The relitigator is welcome to bring the initiative back when the conditions change. They are not welcome to keep the question alive at every meeting until the discipline erodes around them.

The decision was made the day the initiative was excluded. The work begins the day after.`,

    // Reverse so newest appears first
    const sortedPosts = [...posts].reverse();

    function renderCards(filter) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      sortedPosts.forEach(post => {
        const show = filter === 'all' || post.pillar === filter;
        if (!show) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = post.id;
        card.innerHTML = `
          <div class="card-meta">
            <span class="tag tag-pillar">${pillarLabel(post.pillar)}</span>
            <span class="tag tag-type">${post.type}</span>
            <span class="card-date">${post.date}</span>
          </div>
          <h2>${post.title}</h2>
          <p class="card-excerpt">${post.excerpt}</p>
          <div class="card-footer">
            <span class="read-more">Read →</span>
            <span class="card-read-time">${post.readTime} read</span>
          </div>
        `;
        card.addEventListener('click', () => openModal(post.id));
        grid.appendChild(card);
      });
    }

    function pillarLabel(p) {
      const map = {
        'strategic-clarity': 'Strategic Clarity',
        'executive-authority': 'Executive Authority',
        'cross-domain': 'Cross-Domain',
        'all': 'Framework'
      };
      return map[p] || p;
    }

    function openModal(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      document.getElementById('modalTitle').textContent = post.title;
      document.getElementById('modalMeta').innerHTML = `
        <span class="tag tag-pillar">${pillarLabel(post.pillar)}</span>
        <span class="tag tag-type">${post.type}</span>
        <span class="modal-date">${post.date}</span>
      `;
      document.getElementById('modalBody').innerHTML = post.body.map(p => `<p>${p}</p>`).join('');
      document.getElementById('btnCopy').onclick = () => copyText(post.copyText);
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCards(btn.dataset.filter);
      });
    });

    renderCards('all');
  </script>
